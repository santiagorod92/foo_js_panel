name: Feature request
description: Suggest something JS Panel could do, or an API it should support.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The thing you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea of the feature. Mention if it's for Windows, macOS or both.
    validations:
      required: false
  - type: textarea
    id: skin
    attributes:
      label: Script or API involved
      description: For a missing method or callback (e.g. utils.GetAlbumArtAsync, on_playlist_items_added), which script uses it and a snippet of the code that calls it.
      render: text
    validations:
      required: false
