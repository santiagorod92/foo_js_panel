name: Bug report
description: Something in JS Panel doesn't work or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The **diagnostics** section below is the
        most useful part: it tells us your versions, your panels, the scripts they run and their errors,
        and what the component logged around the problem. It takes about a minute.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A screenshot helps a lot for drawing problems.
      placeholder: |
        I loaded the js-smooth playlist script in a JS Panel.
        I expected the playlist to draw, but the panel shows "script error".
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest list of steps that makes it happen. Say if it only happens sometimes.
      placeholder: |
        1. Add a JS Panel to the layout (or a Panels UI skin)
        2. Right-click it › Choose script file… › pick the script
        3. ...
    validations:
      required: true

  - type: input
    id: skin
    attributes:
      label: Script or theme
      description: Which script or theme, and where you got it (a link if it's public). "Built-in sample" if it's the default one.
      placeholder: Eole 4.x (github.com/Ottodix/Eole-foobar-theme), WSHsmoothplaylist.js
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (x64)
        - Windows on ARM
        - macOS
        - Windows under Wine (Linux)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Diagnostics

        **1. Turn on verbose logging** (recommended, so the log has the full detail):
        *View › JS Panel › Verbose logging*.

        **2. Reproduce the problem** once more, right away.

        **3. Copy the diagnostics:** *View › JS Panel › Copy diagnostics*, then paste below.

        **4. Turn verbose logging off** again if you like.

        Your home folder is replaced by `~` and your user name by `<user>` in paths. Read it
        before posting anyway.

        If foobar2000 crashed, open `foo_js_panel.log` in your foobar2000 profile folder and
        attach that file.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output of **Copy Diagnostics** here.
      placeholder: |
        ### foo_js_panel diagnostics

        - Component: 1.x.y (x64)
        - foobar2000: foobar2000 v2.x
        ...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the attached log file, other components involved (Panels UI, foo_navidrome, Columns UI), etc.
    validations:
      required: false
